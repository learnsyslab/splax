name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
          environments: tests-cpu
          activate-environment: false
          locked: true
      - run: pixi run -e tests-cpu pytest -v tests
