name: Ty
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ty-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
          environments: lint
          activate-environment: false
          locked: true
      # Type check the library with the lint pixi environment.
      - run: pixi run -e lint ty
