name: Ruff
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
          environments: lint
          activate-environment: false
          locked: true
      - run: pixi run -e lint ruff-check

  ruff-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
          environments: lint
          activate-environment: false
          locked: true
      - run: pixi run -e lint ruff-format-check

